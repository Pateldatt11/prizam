<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizam Admin | Portal Login</title>

    <!-- Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      :root {
        --primary: #0f172a;
        --primary-hover: #1e293b;
        --surface: #ffffff;
        --bg: #f8fafc;
        --border: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --danger: #ef4444;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --radius: 12px;
        --shadow:
          0 20px 25px -5px rgba(15, 23, 42, 0.06),
          0 8px 10px -6px rgba(15, 23, 42, 0.04);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 50% 0%,
          #ffffff 0%,
          var(--bg) 75%
        );
        padding: 1.5rem;
        color: var(--text-main);
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2.75rem 2.25rem;
        box-shadow: var(--shadow);
        animation: cardAppear 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes cardAppear {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .login-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: var(--primary);
        margin-bottom: 0.35rem;
      }

      .login-brand span {
        color: var(--primary);
        font-size: 1rem;
      }

      .login-subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .login-error {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger);
        font-size: 0.85rem;
        font-weight: 500;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1.25rem;
        display: none;
        align-items: center;
        gap: 0.5rem;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.45rem;
        color: var(--text-main);
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper i.field-icon {
        position: absolute;
        left: 1rem;
        color: var(--text-muted);
        font-size: 0.95rem;
        pointer-events: none;
        transition: color 0.2s ease;
      }

      .form-group input {
        width: 100%;
        padding: 0.85rem 1rem 0.85rem 2.65rem;
        background: #ffffff;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        color: var(--text-main);
        outline: none;
        transition: all 0.2s ease;
      }

      .form-group input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
      }

      .form-group input:focus + i.field-icon {
        color: var(--primary);
      }

      .toggle-password {
        position: absolute;
        right: 1rem;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.95rem;
        padding: 0.25rem;
      }

      .toggle-password:hover {
        color: var(--text-main);
      }

      .btn-login {
        width: 100%;
        padding: 0.85rem 1rem;
        background: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        margin-top: 0.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn-login:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .btn-login:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .portal-footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .portal-footer a {
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
      }

      .portal-footer a:hover {
        text-decoration: underline;
      }
    </style>
    <link rel="stylesheet" href="../assets/css/responsive.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-brand"><span>●</span> Prizam</div>
        <p class="login-subtitle">
          Control portal for product catalog & customer orders
        </p>
      </div>

      <!-- Error Alert Box -->
      <div class="login-error" id="loginErrorMsg">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="errorText">Invalid email or password</span>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="adminEmail"
              placeholder="admin@prizam.com"
              required
              autocomplete="email"
            />
            <i class="fa-regular fa-envelope field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="adminPassword"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <i class="fa-solid fa-lock field-icon"></i>
            <button
              type="button"
              class="toggle-password"
              id="togglePasswordBtn"
              aria-label="Toggle password visibility"
            >
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="portal-footer">
        <a href="../index.html"
          ><i class="fa-solid fa-arrow-left"></i> Back to Storefront</a
        >
      </div>
    </div>

    <script type="module">
      import { auth } from "../assets/js/firebase-config.js";
      import {
        onAuthStateChanged,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        setPersistence,
        browserSessionPersistence,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

      // NOTE: ADMIN_PASSWORD is now only used as the "default" password to
      // auto-create the admin account the very first time it doesn't exist.
      // It is NOT used to block sign-in anymore — real sign-in always goes
      // straight to Firebase, so it works with whatever password is
      // actually set on the admin account in Firebase Auth.
      const ADMIN_EMAIL = "admin@prizam.com";
      const ADMIN_PASSWORD = "admin123";

      const loginForm = document.getElementById("adminLoginForm");
      const errorMsg = document.getElementById("loginErrorMsg");
      const errorText = document.getElementById("errorText");
      const loginBtn = document.getElementById("loginBtn");
      const passwordInput = document.getElementById("adminPassword");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const eyeIcon = document.getElementById("eyeIcon");

      // Check Auto-Login with Heartbeat
      onAuthStateChanged(auth, async (user) => {
        if (user && user.email === ADMIN_EMAIL) {
          const lastHb = localStorage.getItem("admin_heartbeat");
          const now = Date.now();

          if (lastHb && now - parseInt(lastHb) > 15000) {
            await signOut(auth);
            localStorage.removeItem("admin_heartbeat");
            sessionStorage.removeItem("prizam_admin_logged_in");
          } else {
            sessionStorage.setItem("prizam_admin_logged_in", "true");
            window.location.replace("index.html");
          }
        }
      });

      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeIcon.className = isPassword
          ? "fa-regular fa-eye-slash"
          : "fa-regular fa-eye";
      });

      function showError(message) {
        errorText.textContent = message;
        errorMsg.style.display = "flex";
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.style.display = "none";
        loginBtn.disabled = true;
        loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

        const email = document.getElementById("adminEmail").value.trim();
        const password = passwordInput.value;

        try {
          if (email.toLowerCase() !== ADMIN_EMAIL) {
            showError("This email is not the admin account.");
            return;
          }

          await setPersistence(auth, browserSessionPersistence);

          let credential;
          try {
            // Sign in with whatever password the user actually typed.
            credential = await signInWithEmailAndPassword(
              auth,
              ADMIN_EMAIL,
              password,
            );
          } catch (signInError) {
            // Only auto-create the account if it genuinely doesn't exist
            // yet, AND the typed password matches the default. This stops
            // a wrong password from silently trying to "create" a new
            // account (which was masking the real error before).
            const notFoundCodes = [
              "auth/user-not-found",
              "auth/invalid-credential",
            ];
            if (
              notFoundCodes.includes(signInError.code) &&
              password === ADMIN_PASSWORD
            ) {
              try {
                credential = await createUserWithEmailAndPassword(
                  auth,
                  ADMIN_EMAIL,
                  ADMIN_PASSWORD,
                );
              } catch (createError) {
                // Account already exists with a different password —
                // the original sign-in error is the real one to show.
                throw signInError;
              }
            } else {
              throw signInError;
            }
          }

          if (credential.user.email !== ADMIN_EMAIL) {
            throw {
              code: "custom/not-authorized",
              message: "This account is not authorized for the admin portal.",
            };
          }

          localStorage.setItem("admin_heartbeat", Date.now().toString());
          sessionStorage.setItem("prizam_admin_logged_in", "true");
          window.location.href = "index.html";
        } catch (error) {
          console.error("Admin sign-in failed:", error);
          // Show the REAL Firebase error instead of a generic message,
          // so the actual cause (wrong password, provider disabled,
          // unauthorized domain, etc.) is visible.
          const code = error && error.code ? error.code : "unknown";
          const readable =
            {
              "auth/wrong-password": "Incorrect password.",
              "auth/invalid-credential": "Incorrect email or password.",
              "auth/user-not-found": "No admin account found for this email.",
              "auth/too-many-requests":
                "Too many attempts. Please wait a moment and try again.",
              "auth/network-request-failed":
                "Network error — check your internet connection.",
              "auth/unauthorized-domain":
                "This domain is not authorized in Firebase Auth settings.",
              "auth/operation-not-allowed":
                "Email/Password sign-in is disabled in Firebase Auth settings.",
            }[code] || error.message || "Unable to sign in.";

          showError(`${readable} (${code})`);
          loginBtn.disabled = false;
          loginBtn.innerHTML = `<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>`;
        }
      });
    </script>
  </body>
</html>
